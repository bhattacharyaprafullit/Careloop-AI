name: Keepalive & Scheduled SLA Tick

on:
  schedule:
    # Runs every 10 minutes for /healthz keep-alive and /internal/tick SLA sweep
    - cron: "*/10 * * * *"
    # Runs once daily at 03:15 UTC for Supabase /healthz/db keep-alive
    - cron: "15 3 * * *"
  workflow_dispatch:

jobs:
  keepalive-and-tick:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /healthz (every 10 min)
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          API_BASE_URL="${API_BASE_URL:-https://careloop-ai-a71u.onrender.com}"
          curl -fsS --retry 2 --retry-delay 5 --max-time 90 -H "Accept: application/json" "$API_BASE_URL/healthz"

      - name: Ping database /healthz/db (daily keep-alive)
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          API_BASE_URL="${API_BASE_URL:-https://careloop-ai-a71u.onrender.com}"
          curl -fsS --retry 2 --retry-delay 5 --max-time 60 -H "Accept: application/json" "$API_BASE_URL/healthz/db"

      - name: Trigger /api/v1/internal/tick SLA & sandbox sweep
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          API_BASE_URL="${API_BASE_URL:-https://careloop-ai-a71u.onrender.com}"
          CRON_TOKEN="${CRON_TOKEN:-demo-cron-secret-token-12345}"
          curl -fsS --retry 2 --retry-delay 5 --max-time 60 -X POST \
            -H "Accept: application/json" \
            -H "X-Cron-Token: $CRON_TOKEN" \
            "$API_BASE_URL/api/v1/internal/tick" || true
