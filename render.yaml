services:
  - type: web
    name: careloop-api
    runtime: python
    buildCommand: "cd apps/api && pip install uv && uv sync --frozen --no-dev"
    startCommand: "cd apps/api && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: CRON_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:3000"
      - key: DEMO_MODE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
